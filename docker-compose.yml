version: '3.8'

services:
  # Neo4j Database
  neo4j:
    image: neo4j:5.15-community
    container_name: gtd-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_memory_heap_max__size=512M
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - neo4j-import:/var/lib/neo4j/import
      - ./backend/database/setup:/setup
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gtd-network

  # Ollama (Optional - for self-hosted LLMs)
  ollama:
    image: ollama/ollama:latest
    container_name: gtd-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - gtd-network
    profiles:
      - ollama  # Only start if explicitly requested

  # GTD API Server
  api:
    build:
      context: ./backend/database
      dockerfile: Dockerfile
    container_name: gtd-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
      # AI Provider Configuration
      - AI_PROVIDER=${AI_PROVIDER:-disabled}
      - AI_PROVIDER_API_KEY=${AI_PROVIDER_API_KEY:-}
      # OpenAI
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4}
      # Anthropic
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-3-sonnet-20240229}
      # Ollama
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama2}
      # Security
      - AI_SECURITY_LEVEL=${AI_SECURITY_LEVEL:-strict}
      - AI_JAILBREAK_THRESHOLD=${AI_JAILBREAK_THRESHOLD:-70}
      # Stripe (optional)
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
    volumes:
      - ./backend/database:/app
      - /app/node_modules
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - gtd-network
    profiles:
      - api  # Only start if explicitly requested

volumes:
  neo4j-data:
  neo4j-logs:
  neo4j-import:
  ollama-data:

networks:
  gtd-network:
    driver: bridge
